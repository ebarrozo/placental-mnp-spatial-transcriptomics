# Paths are relative to repository root unless absolute paths are supplied.
public_object_path: data/external/spatial_mnp_publication_processed_seurat_v1.rds
output_dir: outputs
figure_dir: outputs/figures
table_dir: outputs/tables
log_dir: outputs/logs

# Analysis definitions
mnp_threshold_ug_g: 146.3
primary_group_col: MNPBurden
primary_delivery_col: Delivery_class
sample_id_col: sample_id_standardized
donor_id_col: donor_id
celltype_col: celltype_display
platform_col: platform_clean

# Module score columns expected in the public object
module_score_cols:
  - ECM_Remodeling_score
  - Vascular_Interface_score
  - Macrophage_Remodeling_score
  - NK_Cytotoxic_Regulatory_score
  - Trophoblast_Remodeling_score

# Polymer columns expected in the public object
polymer_ug_g_cols:
  - pe_ug_per_g
  - sbr_ug_per_g
  - pp_ug_per_g
  - pvc_ug_per_g
  - n66_ug_per_g
  - pet_ug_per_g
  - n6_ug_per_g
  - pmma_ug_per_g
  - pc_ug_per_g
  - pu_ug_per_g
  - abs_ug_per_g
  - ps_ug_per_g
